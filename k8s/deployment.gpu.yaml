# ===================================================================
# williw GPU 版本 Kubernetes 部署配置
# ===================================================================
# 
# 使用方式:
#   kubectl apply -f k8s/deployment.gpu.yaml
#
# 前置要求:
#   - NVIDIA GPU 节点
#   - nvidia-device-plugin 已安装
#   - nvidia-container-runtime 配置
#

---
# ===================================================================
# GPU 版本 Deployment
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: williw-gpu
  labels:
    app: williw
    variant: gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: williw
      variant: gpu
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: williw
        variant: gpu
    spec:
      # GPU 节点容忍度
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      # 安全上下文
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: williw
          image: williw:latest
          imagePullPolicy: IfNotPresent
          # GPU 镜像（如果需要单独构建）
          # image: williw:gpu
          ports:
            - name: quic
              containerPort: 9235
              protocol: UDP
            - name: quic-tcp
              containerPort: 9235
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: WILLIW_DEVICE_TYPE
              value: "high"
            - name: WILLIW_ENABLE_GPU
              value: "true"
            - name: WILLIW_MODEL_DIM
              value: "256"
            # CUDA 配置
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          # GPU 资源配置 - 关键！
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
              nvidia.com/gpu: 1
            limits:
              memory: "4Gi"
              cpu: "2000m"
              nvidia.com/gpu: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /home/williw/data
            - name: checkpoints
              mountPath: /home/williw/checkpoints
      volumes:
        - name: data
          emptyDir: {}
        - name: checkpoints
          emptyDir: {}
      # GPU 节点选择
      nodeSelector:
        gpu: "nvidia"

---
# ===================================================================
# GPU 版本 Service
# ===================================================================
apiVersion: v1
kind: Service
metadata:
  name: williw-gpu
  labels:
    app: williw
spec:
  clusterIP: None
  ports:
    - name: quic-udp
      port: 9235
      targetPort: 9235
      protocol: UDP
    - name: quic-tcp
      port: 9235
      targetPort: 9235
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: williw
    variant: gpu
