# ===================================================================
# williw StatefulSet 配置
# ===================================================================
# 
# 用途：需要持久化节点身份的场景
# 特点：稳定的网络标识 + 持久化存储
#

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: williw-stateful
  labels:
    app: williw
spec:
  serviceName: williw-stateful
  replicas: 3
  selector:
    matchLabels:
      app: williw
  # 滚动更新策略
  updateStrategy:
    type: RollingUpdate
  # Pod 管理策略
  podManagementPolicy: Parallel
  # 持久化卷声明模板
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "standard"
        resources:
          requests:
            storage: "1Gi"
    - metadata:
        name: checkpoints
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "standard"
        resources:
          requests:
            storage: "5Gi"
  template:
    metadata:
      labels:
        app: williw
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: williw
          image: williw:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: quic
              containerPort: 9235
              protocol: UDP
            - name: http
              containerPort: 8080
              protocol: TCP
          # 使用 StatefulSet 的稳定主机名作为节点 ID
          env:
            - name: RUST_LOG
              value: "info"
            - name: WILLIW_DEVICE_TYPE
              value: "high"
            - name: WILLIW_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WILLIW_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WILLIW_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /home/williw/data
            - name: checkpoints
              mountPath: /home/williw/checkpoints

---
# Headless Service - 提供稳定的网络标识
apiVersion: v1
kind: Service
metadata:
  name: williw-stateful
  labels:
    app: williw
spec:
  clusterIP: None
  ports:
    - name: quic
      port: 9235
      targetPort: 9235
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: williw
