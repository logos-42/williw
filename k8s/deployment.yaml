# ===================================================================
# williw Kubernetes 部署配置
# ===================================================================
# 
# 使用方式:
#   CPU 版本:    kubectl apply -f k8s/deployment.yaml
#   GPU 版本:    kubectl apply -f k8s/deployment.gpu.yaml
#
# 前置要求:
#   - nvidia-device-plugin (GPU 版本)
#   - StorageClass 配置
#

---
# ===================================================================
# CPU 版本 Deployment
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: williw-cpu
  labels:
    app: williw
    variant: cpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: williw
      variant: cpu
  # 滚动更新策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: williw
        variant: cpu
    spec:
      # 安全上下文
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # 容器配置
      containers:
        - name: williw
          image: williw:latest
          imagePullPolicy: IfNotPresent
          # 端口配置
          ports:
            - name: quic
              containerPort: 9235
              protocol: UDP
            - name: quic-tcp
              containerPort: 9235
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          # 环境变量
          env:
            - name: RUST_LOG
              value: "info"
            - name: WILLIW_DEVICE_TYPE
              value: "high"
            - name: WILLIW_MODEL_DIM
              value: "128"
          # 资源限制
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          # 健康检查
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          # 存储卷挂载
          volumeMounts:
            - name: data
              mountPath: /home/williw/data
            - name: checkpoints
              mountPath: /home/williw/checkpoints
      # 存储卷
      volumes:
        - name: data
          emptyDir: {}
        - name: checkpoints
          emptyDir: {}
      # 节点选择（可选）
      # nodeSelector:
      #   kubernetes.io/arch: amd64

---
# ===================================================================
# Service 配置 (P2P 通信)
# ===================================================================
apiVersion: v1
kind: Service
metadata:
  name: williw-cpu
  labels:
    app: williw
spec:
  # Headless Service - 用于 P2P 节点发现
  clusterIP: None
  ports:
    - name: quic-udp
      port: 9235
      targetPort: 9235
      protocol: UDP
    - name: quic-tcp
      port: 9235
      targetPort: 9235
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: williw
    variant: cpu

---
# ===================================================================
# ConfigMap 配置
# ===================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: williw-config
data:
  # 日志级别
  RUST_LOG: "info"
  # 设备配置
  WILLIW_DEVICE_TYPE: "high"
  WILLIW_MODEL_DIM: "128"
  # P2P 配置
  WILLIW_GOSSIP_TOPIC: "williw-training"
  # 网络配置
  WILLIW_MAX_CONNECTIONS: "50"
